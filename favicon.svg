<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { fill: #e6edf3; font-size: 42px; font-weight: 700; letter-spacing: 2px; }
      .sub   { fill: #7d8590; font-size: 15px; letter-spacing: 2px; }
      .cursor { fill: #58a6ff; animation: blink 1.1s steps(1) infinite; }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* flask liquid gentle glow */
      .liquid {
        animation: glow 3.4s ease-in-out infinite;
      }
      @keyframes glow {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1; }
      }

      /* bubbles rising inside flask */
      .bubble {
        animation: rise 2.8s ease-in infinite;
        transform-origin: center;
      }
      @keyframes rise {
        0%   { transform: translateY(0) scale(0.6); opacity: 0; }
        15%  { opacity: 0.9; }
        90%  { opacity: 0; }
        100% { transform: translateY(-46px) scale(1); opacity: 0; }
      }

      /* generic data blocks flowing in (left -> flask) */
      .flow-in {
        animation: flowIn 3.2s ease-in-out infinite;
      }
      @keyframes flowIn {
        0%   { transform: translateX(0); opacity: 0; }
        15%  { opacity: 1; }
        70%  { opacity: 1; }
        100% { transform: translateX(110px); opacity: 0; }
      }

      /* generic data blocks flowing out (flask -> right), recolored */
      .flow-out {
        animation: flowOut 3.2s ease-in-out infinite;
      }
      @keyframes flowOut {
        0%   { transform: translateX(0); opacity: 0; }
        30%  { opacity: 0; }
        45%  { opacity: 1; }
        100% { transform: translateX(110px); opacity: 0; }
      }
    </style>
  </defs>

  <rect class="bg" width="1200" height="260" rx="10"/>

  <!-- Title -->
  <text x="40" y="60" class="title">CODEC LAB<tspan class="cursor">_</tspan></text>
  <text x="42" y="86" class="sub">extensible media codec toolkit</text>

  <!-- Incoming generic data blocks -->
  <g transform="translate(380,150)">
    <rect class="flow-in" x="0"  y="-10" width="16" height="16" rx="3" fill="#f78166" style="animation-delay:0s"/>
    <rect class="flow-in" x="0"  y="14"  width="16" height="16" rx="3" fill="#56d364" style="animation-delay:0.8s"/>
    <rect class="flow-in" x="0"  y="38"  width="16" height="16" rx="3" fill="#bc8cff" style="animation-delay:1.6s"/>
  </g>

  <!-- Flask (material-icon style, flat) -->
  <g transform="translate(560,60)">
    <!-- neck -->
    <rect x="34" y="0" width="20" height="34" rx="3" fill="none" stroke="#c9d1d9" stroke-width="4"/>
    <!-- cork -->
    <rect x="30" y="-10" width="28" height="10" rx="2" fill="#8b949e"/>
    <!-- flask body outline -->
    <path d="M34,34 L34,64 L4,132 Q-2,148 14,148 L74,148 Q90,148 84,132 L54,64 L54,34 Z"
          fill="none" stroke="#c9d1d9" stroke-width="4" stroke-linejoin="round"/>
    <!-- liquid fill -->
    <clipPath id="flaskClip">
      <path d="M34,34 L34,64 L4,132 Q-2,148 14,148 L74,148 Q90,148 84,132 L54,64 L54,34 Z"/>
    </clipPath>
    <g clip-path="url(#flaskClip)">
      <rect class="liquid" x="-10" y="90" width="110" height="70" fill="#58a6ff" opacity="0.85"/>
      <circle class="bubble" cx="30" cy="130" r="4" fill="#a5d6ff" style="animation-delay:0s"/>
      <circle class="bubble" cx="46" cy="135" r="3" fill="#a5d6ff" style="animation-delay:0.9s"/>
      <circle class="bubble" cx="58" cy="128" r="3.5" fill="#a5d6ff" style="animation-delay:1.7s"/>
      <circle class="bubble" cx="40" cy="140" r="2.5" fill="#a5d6ff" style="animation-delay:2.4s"/>
    </g>
  </g>

  <!-- Outgoing generic data blocks (different palette = "transformed") -->
  <g transform="translate(700,150)">
    <rect class="flow-out" x="0"  y="-10" width="16" height="16" rx="3" fill="#39c5cf" style="animation-delay:0s"/>
    <rect class="flow-out" x="0"  y="14"  width="16" height="16" rx="3" fill="#d29922" style="animation-delay:0.8s"/>
    <rect class="flow-out" x="0"  y="38"  width="16" height="16" rx="3" fill="#f778ba" style="animation-delay:1.6s"/>
  </g>
</svg>
